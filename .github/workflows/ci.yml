name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg and tesseract
        # Retries and a per-request timeout, so a slow mirror fails fast instead of hanging the job.
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT update && sudo apt-get $APT install -y ffmpeg tesseract-ocr fonts-dejavu-core
      - name: Engine dependencies
        working-directory: plugins/explainer-video/engine
        run: npm ci
      - name: Tests
        working-directory: plugins/explainer-video/engine
        # GitHub's Ubuntu runners block unprivileged user namespaces, so Chrome's sandbox cannot start.
        # EV_NO_SANDBOX is the engine's own switch for that; the runner is a throwaway VM.
        env:
          EV_NO_SANDBOX: "1"
        run: node --test
      - name: No keys in the repo
        run: node plugins/explainer-video/engine/bin/ev.mjs scan-secrets .

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate . --strict && claude plugin validate plugins/explainer-video --strict
