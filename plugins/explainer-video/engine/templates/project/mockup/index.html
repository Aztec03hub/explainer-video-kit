<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Lantern Library</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#26211b; --mute:#6f665a; --line:#e3ddd0; --accent:#d9822b; --accent-ink:#fff; --ok:#2f8f5b; }
  [data-theme="dark"] { --bg:#16181d; --card:#1f232b; --ink:#eef0f4; --mute:#9aa3b2; --line:#2e3440; --accent:#f0a24a; --accent-ink:#1a1308; --ok:#4cc38a; }
  /* Built for video: a 1280x720 (16:9) page with large type, so it fills the frame and stays readable on a phone.
     Headings 44px+, body and buttons 28px+, content centred; the camera zooms for detail, the type doesn't shrink. */
  * { box-sizing: border-box; }
  body { margin:0; width:1280px; height:720px; overflow:hidden; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:28px/1.3 system-ui, Segoe UI, Roboto, sans-serif; }
  header { display:flex; align-items:center; gap:32px; padding:16px 56px; border-bottom:1px solid var(--line); }
  .logo { font-weight:700; font-size:44px; } .logo span { color:var(--accent); }
  #search { flex:1; max-width:520px; padding:10px 20px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:28px; }
  main { flex:1; display:flex; justify-content:center; align-items:center; gap:32px; padding:24px 56px; }
  .list { flex:1; display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; }
  .card { display:flex; align-items:center; gap:24px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .cover { width:104px; height:150px; border-radius:8px; flex:none; }
  .card h3 { margin:0 0 4px; font-size:30px; } .card p { margin:0 0 12px; color:var(--mute); }
  .btn { padding:10px 28px; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); font:600 28px system-ui, sans-serif; }
  .panel { display:none; width:500px; padding:28px 32px; background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .panel h2 { margin:0 0 4px; font-size:44px; line-height:1.15; } .panel dl { margin:16px 0; display:grid; grid-template-columns:auto 1fr; gap:6px 24px; }
  .panel dt { color:var(--mute); } .panel dd { margin:0; font-weight:600; }
  #banner { display:none; margin-top:16px; padding:12px 20px; border-radius:12px; background:var(--ok); color:#fff; font-weight:600; }
  body[data-state="open"] .panel, body[data-state="confirmed"] .panel { display:block; }
  body[data-state="open"] .list, body[data-state="confirmed"] .list { grid-template-columns:1fr; }
  body[data-state="open"] .card:nth-child(n+3), body[data-state="confirmed"] .card:nth-child(n+3) { display:none; }
  body[data-state="confirmed"] #banner { display:block; }
  body[data-state="confirmed"] #confirm-btn { display:none; }
</style>
</head>
<body>
<header>
  <div class="logo">Lantern <span>Library</span></div>
  <input id="search" placeholder="Search the shelves" aria-label="Search the shelves">
  </header>
<main>
  <section class="list" id="list"></section>
  <aside class="panel">
    <h2>The Salt Orchard</h2>
    <div style="color:var(--mute)">Maren Voss</div>
    <dl><dt>Due</dt><dd>Mar 14</dd><dt>Branch</dt><dd>Riverside</dd><dt>In line</dt><dd>2 readers</dd></dl>
    <button class="btn" id="confirm-btn">Confirm loan</button>
    <div id="banner">Loan confirmed</div>
  </aside>
</main>
<script>
  // Fake data only. ?theme=dark|light and ?state=default|open|confirmed pick what's drawn.
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.dataset.state = ['open', 'confirmed'].includes(q.get('state')) ? q.get('state') : 'default';
  const books = [['The Salt Orchard', 'Maren Voss', 3, '#c2603a'], ['Paper Lanterns', 'Ines Okafor', 1, '#3a7bc2'],
    ['A Quiet Harbour', 'Tomas Reyes', 5, '#3aa07a'], ['Field Notes on Rain', 'Priya Nandel', 2, '#8a5cc2']];
  document.getElementById('list').innerHTML = books.map(([t, a, n, c], i) =>
    `<div class="card" id="book-${i + 1}"><div class="cover" style="background:${c}"></div><div><h3>${t}</h3>` +
    `<p>${a} - ${n} left</p><button class="btn">Borrow</button></div></div>`).join('');
</script>
</body>
</html>
