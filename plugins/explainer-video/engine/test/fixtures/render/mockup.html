<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lantern Library</title>
<style>
  body { margin: 0; font: 20px system-ui, sans-serif; background: #1d2536; color: #eef; }
  #card { margin: 24px; padding: 24px; background: #2b3650; border-radius: 12px; height: 160px; }
  button { font-size: 20px; padding: 10px 24px; margin: 0 24px 24px; background: #f2a33c; border: 0; border-radius: 8px; }
  .pulse { animation: pulse 1s infinite; }
  @keyframes pulse { from { opacity: .2 } to { opacity: 1 } }
</style></head>
<body>
  <div id="card" class="pulse"></div>
  <button>Borrow</button>
  <script>
    const state = new URLSearchParams(location.search).get('state') || 'home';
    document.getElementById('card').textContent = state === 'detail' ? 'The Lantern Keeper, a quiet novel' : 'Welcome to Lantern Library';
    if (state === 'detail') document.getElementById('card').style.background = '#4a2b50';
  </script>
</body></html>
